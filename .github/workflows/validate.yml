name: Moodle plugin validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout validator
        uses: actions/checkout@v4
        with:
          repository: EduardoKrausME/moodle-plugin-validate
          path: .validator

      - name: Validate plugin
        run: python3 .validator/.chatgpt/run.py --check "$GITHUB_WORKSPACE"
