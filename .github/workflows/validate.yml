name: Moodle plugin validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout validator
        uses: actions/checkout@v4
        with:
          repository: EduardoKrausME/moodle-plugin-validate
          path: validator

      - name: Run finishing pipeline
        id: finishing
        continue-on-error: true
        run: python3 validator/.chatgpt/run.py "$GITHUB_WORKSPACE/plugin"

      - name: Review deterministic changes
        if: always()
        run: git -C plugin diff --check && git -C plugin diff

      - name: Commit deterministic normalization
        if: always()
        run: |
          if ! git -C plugin diff --quiet; then
            git -C plugin config user.name "github-actions[bot]"
            git -C plugin config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C plugin add -A
            git -C plugin commit -m "Apply Moodle plugin finishing normalization"
            git -C plugin push origin HEAD:master
          fi

      - name: Propagate validation result
        if: steps.finishing.outcome != 'success'
        run: exit 1
